AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: QuizForge - Serverless Trivia Quiz Application (100% Free Tier Compatible)

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs20.x

Resources:
  # ------------------------------------------------------------
  # DynamoDB Tables (On-Demand / Free-Tier)
  # ------------------------------------------------------------
  QuizSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: QuizForge-Sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quizId
          AttributeType: S
      KeySchema:
        - AttributeName: quizId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  QuizAttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: QuizForge-Attempts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: attemptId
          AttributeType: S
      KeySchema:
        - AttributeName: attemptId
          KeyType: HASH

  # ------------------------------------------------------------
  # API Gateway HTTP API
  # ------------------------------------------------------------
  QuizForgeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  # ------------------------------------------------------------
  # AWS Lambda Function
  # ------------------------------------------------------------
  QuizForgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: index.handler
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref QuizSessionsTable
          ATTEMPTS_TABLE: !Ref QuizAttemptsTable
          NODE_ENV: production
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuizSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QuizAttemptsTable
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizForgeHttpApi
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizForgeHttpApi
            Path: /
            Method: ANY

  # ------------------------------------------------------------
  # Amazon S3 Bucket (Frontend Static Hosting)
  # ------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "quizforge-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "QuizForge-OAC-${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Bucket Policy allowing CloudFront OAC to read frontend files
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ------------------------------------------------------------
  # Amazon CloudFront Distribution (Global HTTPS CDN)
  # ------------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: "QuizForge Web App Distribution"
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt QuizForgeHttpApi.ApiEndpoint]]
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        # Route /api/* directly to API Gateway HTTP API
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: none
              Headers:
                - Accept
                - Authorization
                - Content-Type
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  CloudFrontURL:
    Description: "Live public HTTPS website URL for QuizForge"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  ApiEndpoint:
    Description: "API Gateway Endpoint URL"
    Value: !GetAtt QuizForgeHttpApi.ApiEndpoint

  FrontendBucketName:
    Description: "Amazon S3 Bucket storing frontend files"
    Value: !Ref FrontendBucket
